<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0a1024" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="佳佳快跑" />
<title>佳佳快跑 · JIAJIA RUN</title>
<style>
  :root{
    --gold:#ffcf4d; --gold-2:#ff9e2c; --ink:#070b16;
    --glass:rgba(16,24,46,.72); --line:rgba(140,170,255,.22);
    --txt:#eaf0ff; --dim:rgba(200,214,255,.6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;overflow:hidden}
  canvas#game{display:block;width:100%;height:100%}
  #ui{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .hidden{display:none!important}

  /* ---------- HUD ---------- */
  .hud{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 16px 0;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .stat{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);
    font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.3px;font-size:17px;
    box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .stat .k{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:1px}
  .coin-dot{width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff2b8,#ffc93c 55%,#e08a12);
    box-shadow:inset 0 -2px 3px rgba(140,70,0,.5),0 0 10px rgba(255,190,60,.5)}
  .dist-num{color:#fff}
  .dist-unit{font-size:12px;color:var(--dim);font-weight:600}

  .powers{position:absolute;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px}
  .power{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border-radius:14px;
    background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);
    animation:pop .18s ease-out}
  .power .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px}
  .power .bar{width:64px;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
  .power .bar i{display:block;height:100%;border-radius:3px;background:var(--c,#7fd7ff);transition:width .1s linear}
  .power .lab{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--dim)}
  @keyframes pop{from{transform:translateY(6px) scale(.96);opacity:0}to{transform:none;opacity:1}}

  /* ---------- screens ---------- */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:auto;padding:24px;z-index:5}
  .menu{background:linear-gradient(180deg,rgba(4,7,16,.62) 0%,rgba(4,7,16,.26) 24%,rgba(4,7,16,.02) 46%,rgba(4,7,16,.1) 62%,rgba(4,7,16,.68) 86%,rgba(4,7,16,.94) 100%);
    justify-content:flex-end;padding-bottom:calc(54px + env(safe-area-inset-bottom))}
  .brand{position:absolute;top:calc(13vh + env(safe-area-inset-top));left:0;right:0;text-align:center}
  .logo{font-size:clamp(40px,11vw,72px);font-weight:900;letter-spacing:6px;line-height:1;
    background:linear-gradient(180deg,#fff 8%,#ffe6a6 45%,#ffb13c 78%,#ff7a2f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 8px 26px rgba(255,150,40,.35))}
  .logo-sub{margin-top:10px;font-size:12px;letter-spacing:10px;color:rgba(190,210,255,.62);font-weight:700}
  .tagline{margin-top:14px;font-size:13px;color:rgba(210,222,255,.55);letter-spacing:2px}

  .btn{pointer-events:auto;border:0;cursor:pointer;font-family:inherit;font-weight:800;
    padding:16px 54px;border-radius:999px;font-size:19px;letter-spacing:3px;color:#3a1b00;
    background:linear-gradient(180deg,#ffe89a,#ffc13b 45%,#ff8f1f);
    box-shadow:0 10px 30px rgba(255,150,30,.36),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(160,70,0,.28);
    transition:transform .12s ease,filter .12s ease;text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .btn:active{transform:translateY(2px) scale(.985);filter:brightness(.97)}
  .btn.ghost{background:rgba(255,255,255,.08);color:var(--txt);border:1px solid var(--line);
    box-shadow:none;font-size:15px;padding:13px 40px;letter-spacing:2px;text-shadow:none}
  .menu-foot{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;
    display:flex;justify-content:center;gap:18px;font-size:12px;color:rgba(190,205,238,.45);letter-spacing:1px}
  .menu-foot b{color:var(--gold)}

  .over{background:rgba(4,7,16,.72);backdrop-filter:blur(6px);animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{width:min(360px,86vw);border-radius:26px;padding:26px 24px 22px;text-align:center;
    background:linear-gradient(180deg,rgba(26,36,66,.96),rgba(12,18,36,.97));
    border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .28s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes rise{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .over-title{font-size:13px;letter-spacing:4px;color:var(--dim);font-weight:700}
  .over-score{font-size:56px;font-weight:900;line-height:1.15;margin:6px 0 2px;
    background:linear-gradient(180deg,#fff,#ffd27a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .over-score span{font-size:20px;color:var(--dim);-webkit-text-fill-color:var(--dim);margin-left:4px}
  .over-row{display:flex;justify-content:space-between;margin:16px 0 20px;padding:14px 16px;border-radius:16px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
  .over-row div{font-size:12px;color:var(--dim);letter-spacing:1px}
  .over-row b{display:block;margin-top:5px;font-size:19px;color:#fff;font-variant-numeric:tabular-nums}
  .over .btn{width:100%;padding:14px 0;font-size:17px}
  .over .btn.ghost{margin-top:10px}
  .best-tag{display:inline-block;margin-top:4px;font-size:11px;letter-spacing:1px;color:#ffd97a;
    background:rgba(255,190,60,.12);border:1px solid rgba(255,190,60,.25);padding:3px 10px;border-radius:999px}

  .toast{position:absolute;left:0;right:0;top:32%;text-align:center;font-size:26px;font-weight:900;
    letter-spacing:4px;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6),0 0 20px rgba(255,220,140,.4);
    opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none}
  .toast.on{opacity:1}
  .toast.skill{color:#ffe6a6;font-size:22px}
  .hintbar{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;
    font-size:12px;letter-spacing:2px;color:rgba(210,225,255,.4)}

  /* ---------- 商店 ---------- */
  .menu > .btn + .btn{margin-top:10px}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass);
    color:#fff;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px}
  .shop{background:linear-gradient(180deg,rgba(8,12,24,.97),rgba(4,6,13,.99));justify-content:flex-start;padding:0;gap:0}
  .shop-head{display:flex;align-items:center;gap:12px;width:100%;
    padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
  .shop-title{flex:1;font-weight:800;letter-spacing:4px;font-size:16px}
  .shop-coin{padding:6px 12px 6px 9px;font-size:15px}
  .shop-list{width:100%;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 16px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  .skin-card{display:flex;gap:12px;padding:10px;border-radius:20px;
    background:linear-gradient(180deg,rgba(26,36,66,.92),rgba(14,20,38,.94));
    border:1px solid var(--line);position:relative}
  .skin-card.equipped{border-color:rgba(255,200,80,.6);box-shadow:0 0 0 1px rgba(255,200,80,.2),0 12px 32px rgba(0,0,0,.45)}
  .skin-art{width:86px;height:114px;border-radius:14px;overflow:hidden;flex:none;position:relative;background:#05070f}
  .skin-art img{width:100%;height:100%;object-fit:cover;display:block}
  .skin-art .tag{position:absolute;left:4px;top:4px;font-size:9px;padding:2px 6px;border-radius:6px;
    background:rgba(0,0,0,.6);color:#ffd98a;letter-spacing:1px}
  .skin-art .lock{position:absolute;right:5px;bottom:5px;font-size:13px;filter:drop-shadow(0 1px 3px #000)}
  .skin-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .skin-name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
  .skin-name .lv{font-size:10px;font-weight:700;color:#ffd98a;background:rgba(255,200,80,.12);
    border:1px solid rgba(255,200,80,.28);padding:1px 6px;border-radius:999px}
  .skin-skill{font-size:11px;color:rgba(210,224,255,.78);line-height:1.45}
  .skin-skill b{color:#9fd8ff}
  .skin-blurb{font-size:10px;color:rgba(190,205,238,.42);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .skin-actions{margin-top:auto;display:flex;gap:8px;padding-top:6px}
  .skin-actions button{flex:1;border:0;border-radius:11px;padding:9px 6px;font-size:12px;font-weight:800;
    font-family:inherit;cursor:pointer;background:rgba(255,255,255,.09);color:#dfe6ff;transition:transform .1s}
  .skin-actions button:active{transform:scale(.97)}
  .skin-actions button.primary{background:linear-gradient(180deg,#ffe89a,#ffc13b);color:#3a1b00}
  .skin-actions button:disabled{opacity:.38;cursor:default}

  .skill-btn{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;
    border:1px solid rgba(120,220,255,.4);
    background:linear-gradient(180deg,rgba(30,90,130,.95),rgba(12,40,70,.95));
    color:#dff4ff;font-family:inherit;font-size:13px;font-weight:800;letter-spacing:1px;
    cursor:pointer;pointer-events:auto;box-shadow:0 8px 24px rgba(0,140,220,.32)}
  .skill-btn b{background:rgba(255,255,255,.18);border-radius:8px;padding:1px 7px;font-size:12px}
  .skill-btn:disabled{opacity:.45}
  .pause-btn{position:absolute;right:16px;top:calc(64px + env(safe-area-inset-top));
    width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);
    color:#dfe6ff;font-size:12px;font-weight:800;letter-spacing:1px;pointer-events:auto;
    backdrop-filter:blur(12px);cursor:pointer}

  /* ---------- 等级 / 地图 / 激活码 ---------- */
  .btn-row{display:flex;gap:10px;margin-top:10px;width:min(320px,78vw)}
  .btn-row .btn{flex:1;padding:13px 0;font-size:15px;letter-spacing:2px}
  .lvlbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;
    color:var(--dim);font-weight:700;letter-spacing:1px}
  .lvlbar b{color:#ffd98a;font-size:14px}
  .xpbar{width:104px;height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
  .xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd7ff,#ffd76a);transition:width .3s}
  .code-link{color:#8fb8ff;text-decoration:underline;cursor:pointer;pointer-events:auto}
  .map-thumb{width:86px;height:86px;border-radius:16px;display:grid;place-items:center;font-size:34px;
    background:linear-gradient(160deg,#22304e,#101828);flex:none;border:1px solid var(--line)}
  .code-input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:#fff;font-size:16px;text-align:center;letter-spacing:3px;
    margin:14px 0 16px;font-family:inherit;outline:none}
</style>
</head>
